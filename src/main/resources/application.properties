spring.application.name=eventsrus

# Datasource (Supabase Postgres) - values supplied via application-local.properties or env vars
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - Flyway owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Google Sign-In (must match the "Web application" OAuth client ID Flutter's google_sign_in uses as serverClientId)
google.oauth.client-id=${GOOGLE_CLIENT_ID}

# AWS S3 (vendor onboarding image uploads)
aws.s3.public-bucket=${AWS_S3_PUBLIC_BUCKET}
aws.s3.private-bucket=${AWS_S3_PRIVATE_BUCKET}
aws.s3.region=${AWS_S3_REGION}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# Multipart uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Frontend origin (used to build PayPal return/cancel redirect URLs)
app.frontend-base-url=${APP_FRONTEND_BASE_URL}

# Vendor subscriptions - free-trial length granted at onboarding, and how
# many days before expiry the paywall/renewal prompt should start showing.
# Change these here (no code change needed) - e.g. drop to 3 once the
# 6-month trial period is over.
app.vendor-trial-months=6
app.subscription-warning-days=30

# PayPal (sandbox base url: https://api-m.sandbox.paypal.com, live: https://api-m.paypal.com)
paypal.base-url=${PAYPAL_BASE_URL}
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID}
paypal.plan-id.pro-monthly=${PAYPAL_PLAN_ID_PRO_MONTHLY}
paypal.plan-id.pro-annual=${PAYPAL_PLAN_ID_PRO_ANNUAL}
paypal.plan-id.premium-monthly=${PAYPAL_PLAN_ID_PREMIUM_MONTHLY}
paypal.plan-id.premium-annual=${PAYPAL_PLAN_ID_PREMIUM_ANNUAL}
