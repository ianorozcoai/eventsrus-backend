spring.application.name=eventsrus

# Datasource (Supabase Postgres) - values supplied via application-local.properties or env vars
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - Flyway owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# Google Sign-In (must match the "Web application" OAuth client ID Flutter's google_sign_in uses as serverClientId)
google.oauth.client-id=${GOOGLE_CLIENT_ID}

# Cloudflare R2 (vendor onboarding image uploads) - S3-API-compatible, see
# R2Config. Same account/endpoint everywhere; only the buckets, credentials,
# and public base URL differ per profile (dev vs prod each get their own
# bucket pair and API token - see application-local/-supabase.properties).
r2.endpoint=${R2_ENDPOINT}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.public-bucket=${R2_PUBLIC_BUCKET}
r2.private-bucket=${R2_PRIVATE_BUCKET}
r2.public-base-url=${R2_PUBLIC_BASE_URL}

# reCAPTCHA v3 (vendor onboarding, verify-if-present - see UserService#becomeVendor)
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}
recaptcha.min-score=0.5

# Multipart uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Frontend origin (used to build PayPal return/cancel redirect URLs)
app.frontend-base-url=${APP_FRONTEND_BASE_URL}

# Admin accounts (AdminAccountService/AdminAccountController) are real,
# DB-backed rows (admin_accounts, BCrypt-hashed passwords) - no plaintext
# credential lives in source or in this file. The very first account is
# bootstrapped once, only while the table is still empty, from these two
# vars; leave them empty after that first run (or once you've created
# further accounts through the admin module itself) - they're never read
# again once admin_accounts has a row.
app.admin-bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin-bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}

# Vendor trial length, subscription expiry warning window, and the referral
# commission amount used to live here as @Value defaults - they're now
# DB-backed System Settings (system_settings table, see SystemSettingKey/
# SystemSettingService/migration V39) so an admin can change them from the
# admin module without a redeploy.

# Events Coordinator - planner-facing AI ideas/advice assistant (see
# CoordinatorService/AnthropicClient). Empty api-key fails closed
# (AnthropicClient returns a clear "not configured yet" error) rather than
# crashing on startup or sending a doomed request. Haiku is deliberately the cheapest current
# model - this feature is scoped to short, general planning advice, not
# anything that needs a bigger model. max-output-tokens keeps answers short
# (both cost and UX). The per-planner daily question quota (abuse/cost
# guard, independent of whatever spend cap is set on the Anthropic account
# itself) is now a DB-backed System Setting - see the note above.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.base-url=https://api.anthropic.com
anthropic.model=claude-haiku-4-5-20251001
anthropic.max-output-tokens=500

# Admin new-signup email alerts (AdminNotificationEmailService) - fires when
# a new planner account is created or a vendor finishes onboarding. Off by
# default (ADMIN_NOTIFICATIONS_ENABLED unset anywhere local/dev ever sets)
# so local testing never sends real email - only Railway's production env
# has it set to true. SMTP credentials are a Gmail account (App Password,
# since Gmail requires one for SMTP auth); blank defaults so a missing
# config fails closed (JavaMailSender throws, caught and logged) rather
# than crashing startup.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.admin-notification-email=${ADMIN_NOTIFICATION_EMAIL:admin.eventsrus@gmail.com}
app.admin-notifications-enabled=${ADMIN_NOTIFICATIONS_ENABLED:false}

# PayPal (sandbox base url: https://api-m.sandbox.paypal.com, live: https://api-m.paypal.com)
paypal.base-url=${PAYPAL_BASE_URL}
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID}
paypal.plan-id.pro-monthly=${PAYPAL_PLAN_ID_PRO_MONTHLY}
paypal.plan-id.pro-annual=${PAYPAL_PLAN_ID_PRO_ANNUAL}
paypal.plan-id.premium-monthly=${PAYPAL_PLAN_ID_PREMIUM_MONTHLY}
paypal.plan-id.premium-annual=${PAYPAL_PLAN_ID_PREMIUM_ANNUAL}
